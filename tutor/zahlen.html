:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; }

/* Kopf */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scr { border-bottom-color: var(--line); }

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 38px; height: 38px; border-radius: 12px; background: #fff; }
.brand b { font-size: 17px; letter-spacing: -.02em; display: block; }
.brand small { color: var(--mute); font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.live { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); font: 600 13px var(--sans); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 0 rgba(255,255,255,.6); animation: pulse 2s infinite; }
.live.zero i { background: var(--dim); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22,160,92,.55); } 70% { box-shadow: 0 0 0 9px rgba(22,160,92,0); } 100% { box-shadow: 0 0 0 0 rgba(22,160,92,0); } }
.sp { flex: 1; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); }
.seg button { height: 30px; padding: 0 13px; border: 0; border-radius: 999px; background: none; color: var(--mute); font-weight: 600; font-size: 13px; cursor: pointer; transition: color .15s, background .2s; white-space: nowrap; }

/* Karten */
.grid { display: grid; gap: var(--gap); margin-top: var(--gap); }
.g7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.g2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.calm .card, .calm .fun .bar i, .calm .bars .r i::after { animation: none !important; }
.chart { min-height: 220px; }
.fnote { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.fnote span { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); font: 600 12px var(--sans); }
.fnote b { font-family: var(--mono); color: var(--ink); }

/* Kennzahlen */
.kpi { padding: 16px 18px 12px; display: grid; gap: 4px; }

.card .hd .tm { display: inline-flex; align-self: center; gap: 2px; padding: 3px; border: 1px solid var(--line2); border-radius: 999px; margin-right: auto; margin-left: 14px; }

.ev { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 12px; }

.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 4px; align-items: center; }

@keyframes sk { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.foot { margin-top: 28px; color: var(--dim); font: 500 12px var(--mono); text-align: center; }

    if (!ses) { busy = false; return gate('Kurz anmelden', 'Melde dich auf bwlmax.de mit deinem Konto an – danach siehst du hier alles, ohne extra Passwort.', '<a class="btn" href="/#/anmelden" onclick="try{sessionStorage.setItem(\'tutor.after\',\'/zahlen\')}catch(e){}">Bei BWL Max anmelden</a>'); }
    if (!quiet && !data) skeleton();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ session: ses, zeit: Z }), cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return { ok: false, status: r.status }; }).then(function (j) { j.status = r.status; return j; }); })
      .then(function (j) {
        busy = false;
        if (j.status === 401) return gate('Kurz anmelden', 'Melde dich bei BWL Max mit deinem Konto an (' + esc('bendeschler0@gmail.com') + ') – danach landest du automatisch wieder hier.', '<a class="btn" href="/#/anmelden" onclick="try{sessionStorage.setItem(\'tutor.after\',\'/zahlen\')}catch(e){}">Bei BWL Max anmelden</a>');
        if (j.status === 403) return gate('Kein Zugriff', 'Das Konto ' + esc(j.email || '') + ' darf diese Zahlen nicht sehen.', '<a class="btn ghost" href="/">Zu BWL Max</a>');
        if (j.status === 404) return gate('Fast fertig', 'Die Datenleitung vom Server wird gerade eingerichtet. Sobald sie steht, erscheinen hier deine Zahlen.', '<button class="btn ghost" onclick="location.reload()">Nochmal versuchen</button>');
        if (!j.ok || !j.basis) { if (data) return; return gate('Server nicht erreichbar', 'Gerade kommen keine Daten durch. Ich versuch es gleich wieder automatisch.', '<button class="btn ghost" onclick="location.reload()">Jetzt nochmal</button>'); }
        data = j; lastOk = Date.now(); draw();
      })
      .catch(function () { busy = false; if (!data) gate('Noch keine Verbindung', 'Die Datenleitung vom Server steht noch nicht oder ist gerade nicht erreichbar. Ich versuch es automatisch weiter.', '<button class="btn ghost" onclick="location.reload()">Jetzt nochmal</button>'); });
  }

  function setZ(z) {
    Z = z; try { localStorage.setItem('zahlen.z', z); } catch (e) {}
    [].forEach.call(segEl.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.dataset.z === z); b.setAttribute('aria-selected', b.dataset.z === z ? 'true' : 'false'); });
  }
  segEl.addEventListener('click', function (e) { var b = e.target.closest('button[data-z]'); if (!b || b.dataset.z === Z) return; setZ(b.dataset.z); firstDraw = true; data = null; load(); });
  setZ(Z);
  var onScroll = function () { var t = $id('top'); if (t) t.classList.toggle('scr', scrollY > 6); };
  addEventListener('scroll', onScroll, { passive: true });
  var rz = 0, onResize; addEventListener('resize', onResize = function () { clearTimeout(rz); rz = setTimeout(function () { if (data) { var c = $id('chart'); if (c) verlauf(c, data.zeitraum.achse, data.basis.achse || [], data.basis.reihe.besuche || [], data.besucherReihe || [], data.basis.reihe.aktiv || []); gChart($id('gchart'), (data.seo || {}).gsc || {}); } }, 150); });
  load();
  timer = setInterval(function () { if (!document.hidden) load(true); }, 20000);
  var tickT = setInterval(tick, 10000);
  var onVis = function () { if (!document.hidden && Date.now() - lastOk > 15000) load(true); };
  document.addEventListener('visibilitychange', onVis);
  // In der App: beim Verlassen alles sauber stoppen
  window.__zlStop = function () { clearInterval(timer); clearInterval(tickT); removeEventListener('scroll', onScroll); removeEventListener('resize', onResize); document.removeEventListener('visibilitychange', onVis); window.__zlStop = null; };
})();
</script>
