<style>
@font-face { font-family: "Geist"; src: url("/tutor/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/tutor/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #000; --card: #0a0a0b; --card2: #111113; --line: #1d1d20; --line2: #2a2a2e;
  --ink: #fafafa; --ink2: #c9c9cf; --mute: #7c7c85; --dim: #4a4a52;
  --r: 22px; --gap: 14px;
  --sans: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; }
.wrap { max-width: none; margin: 0 auto; padding: 22px 24px 80px; }
.num { font-variant-numeric: tabular-nums; }

/* Kopf */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scr { border-bottom-color: var(--line); }
.top-in { max-width: none; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 38px; height: 38px; border-radius: 12px; background: #fff; }
.brand b { font-size: 17px; letter-spacing: -.02em; display: block; }
.brand small { color: var(--mute); font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.live { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); font: 600 13px var(--sans); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 0 rgba(255,255,255,.6); animation: pulse 2s infinite; }
.live.zero i { background: var(--dim); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 70% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
.sp { flex: 1; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); }
.seg button { height: 30px; padding: 0 13px; border: 0; border-radius: 999px; background: none; color: var(--mute); font-weight: 600; font-size: 13px; cursor: pointer; transition: color .15s, background .2s; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--ink); color: #000; }
.stand { color: var(--mute); font: 500 12px var(--mono); white-space: nowrap; }

/* Karten */
.grid { display: grid; gap: var(--gap); margin-top: var(--gap); }
.g7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.g2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.calm .card, .calm .fun .bar i, .calm .bars .r i::after { animation: none !important; }
.chart { min-height: 220px; }
.fnote { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.fnote span { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); font: 600 12px var(--sans); }
.fnote b { font-family: var(--mono); color: var(--ink); }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; overflow: hidden; animation: up .6s cubic-bezier(.16,1,.3,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }
.card h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.card .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card .hd small { color: var(--mute); font: 500 11.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; }

/* Kennzahlen */
.kpi { padding: 16px 18px 12px; display: grid; gap: 4px; }
.kpi .l { color: var(--mute); font-size: 12.5px; font-weight: 550; display: flex; align-items: center; gap: 7px; }
.kpi .l svg { width: 14px; height: 14px; }
.kpi .v { font-size: 34px; font-weight: 650; letter-spacing: -.035em; line-height: 1.05; }
.kpi .d { font: 600 12px var(--mono); color: var(--mute); display: flex; align-items: center; gap: 6px; min-height: 18px; }
.kpi .d b { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 999px; font-weight: 700; background: var(--card2); color: var(--ink2); white-space: nowrap; flex: none; }
.kpi .d span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d b.up { background: var(--ink); color: #000; }
.kpi .d b.down { background: transparent; border: 1px solid var(--line2); color: var(--mute); }
.kpi svg.sp { width: 100%; height: 34px; margin-top: 4px; display: block; }
.kpi.big .v { font-size: 40px; }

/* Verlauf */
.chart { position: relative; }
.chart svg { width: 100%; display: block; overflow: visible; }
.leg { display: flex; gap: 16px; color: var(--mute); font-size: 12.5px; font-weight: 550; }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg i { width: 10px; height: 10px; border-radius: 3px; background: var(--ink); }
.leg i.l2 { background: transparent; border: 2px solid var(--ink2); border-radius: 50%; width: 9px; height: 9px; }
.leg i.l3 { background: var(--line2); }
.tip { position: absolute; pointer-events: none; z-index: 5; padding: 9px 12px; border-radius: 12px; background: var(--ink); color: #000; font: 600 12.5px/1.4 var(--sans); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .12s; box-shadow: 0 12px 30px -10px rgba(0,0,0,.8); }
.tip.on { opacity: 1; }
.tip small { display: block; font: 600 11px var(--mono); opacity: .55; }

/* Trichter */
.fun { display: grid; gap: 10px; }
.fun .r { display: grid; grid-template-columns: 180px minmax(0, 1fr) 54px; align-items: center; gap: 12px; }
.fun .n { font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fun .bar { height: 30px; border-radius: 9px; background: var(--card2); overflow: hidden; position: relative; }
.fun .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 9px; transform-origin: 0 50%; animation: grow 1s cubic-bezier(.16,1,.3,1) both; }
.fun .bar span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 700 13px var(--mono); color: #000; mix-blend-mode: normal; }
.fun .bar span.out { color: var(--ink); }
.fun .p { font: 600 12px var(--mono); color: var(--mute); text-align: right; }
.fun .r.weg .bar i { background: #e5484d; } .fun .r.weg .n, .fun .r.weg .p { color: #ff7b7f; } .fun .r.weg .bar span:not(.out) { color: #fff; }
.card .hd .tm { display: inline-flex; align-self: center; gap: 2px; padding: 3px; border: 1px solid var(--line2); border-radius: 999px; margin-right: auto; margin-left: 14px; }
.card .hd .tm button { height: 26px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--mute); font: 600 12px var(--sans); cursor: pointer; }
.card .hd .tm button.on { background: var(--ink); color: #000; }
@keyframes grow { from { transform: scaleX(0); } }

/* Feed */
.feed { display: grid; gap: 2px; max-height: 380px; overflow-y: auto; scrollbar-width: thin; margin: -4px -8px; padding: 0 4px; }
.ev { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 12px; }
.ev:hover { background: var(--card2); }
.ev .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--card2); border: 1px solid var(--line); }
.ev .ic svg { width: 16px; height: 16px; }
.ev.hot .ic { background: var(--ink); color: #000; border-color: var(--ink); }
.ev .w { min-width: 0; }
.ev .w b { font-weight: 600; font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .w small { color: var(--mute); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.ev .t { color: var(--mute); font: 500 11.5px var(--mono); white-space: nowrap; }
.ev.neu { animation: flash 1.2s ease both; }
@keyframes flash { from { background: rgba(255,255,255,.12); } }

/* Listen mit Balken */
.bars { display: grid; gap: 9px; }
.bars .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.bars .r span { font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .r b { font: 650 13px var(--mono); }
.bars .r i { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--card2); overflow: hidden; display: block; }
.bars .r i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--ink); border-radius: inherit; animation: grow 1s cubic-bezier(.16,1,.3,1) both; transform-origin: 0 50%; }
.sub { color: var(--mute); font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; margin: 16px 0 10px; }
.sub:first-child { margin-top: 0; }
.empty { color: var(--mute); font-size: 13.5px; padding: 6px 0; }

/* Konten */
.konto-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
.konto-top .v { font-size: 44px; font-weight: 650; letter-spacing: -.04em; line-height: 1; }
.konto-top small { color: var(--mute); font-size: 12.5px; display: block; margin-top: 6px; }
.kl { display: grid; gap: 2px; }
.kl .r { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 4px; border-top: 1px solid var(--line); font-size: 13.5px; }
.kl .r:first-child { border-top: 0; }
.kl .r .ic { width: 28px; height: 28px; border-radius: 9px; background: var(--ink); color: #000; display: grid; place-items: center; } .kl .r .ic svg { width: 14px; height: 14px; }
.kl .r small { color: var(--mute); font: 500 11.5px var(--mono); }

/* Heatmap */
.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 4px; align-items: center; }
.heat .h { color: var(--mute); font: 500 10.5px var(--mono); text-align: center; }
.heat .d { color: var(--mute); font: 600 11px var(--mono); }
.heat .c { height: 24px; border-radius: 5px; background: var(--card2); position: relative; }
.heat .c[data-v]:hover { outline: 1px solid var(--ink); }

/* Geräte-Ring */
.ring { display: flex; align-items: center; gap: 18px; }
.ring svg { width: 112px; height: 112px; flex: none; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 9px; }

/* Wege */
.reise { border-top: 1px solid var(--line); padding: 14px 2px; }
.reise:first-of-type { border-top: 0; padding-top: 2px; }
.reise .k { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.reise .k b { font-weight: 650; }
.reise .k small { color: var(--mute); font: 500 12px var(--mono); }
.badge { display: inline-flex; align-items: center; height: 21px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); font: 600 11.5px var(--sans); }
.badge.w { background: var(--ink); color: #000; border-color: var(--ink); }
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.step { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.step svg { width: 13px; height: 13px; flex: none; }
.step.hot { background: var(--ink); color: #000; border-color: var(--ink); font-weight: 600; }
.arrow { color: var(--dim); font-size: 12px; }
.more { margin-top: 14px; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line2); background: none; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.more:hover { border-color: var(--ink); }

/* Zustände */
.gate { min-height: 70dvh; display: grid; place-items: center; text-align: center; padding: 20px; }
.gate .box { max-width: 420px; display: grid; justify-items: center; gap: 12px; }
.gate img { width: 76px; height: 76px; border-radius: 22px; background: #fff; }
.gate h1 { margin: 6px 0 0; font-size: 26px; letter-spacing: -.03em; }
.gate p { margin: 0; color: var(--ink2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--ink); color: #000; font-weight: 650; font-size: 15px; text-decoration: none; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line2); }
.skel { background: linear-gradient(90deg, var(--card) 0%, var(--card2) 40%, var(--card) 80%); background-size: 300% 100%; animation: sk 1.4s linear infinite; border-radius: var(--r); border: 1px solid var(--line); }
@keyframes sk { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.foot { margin-top: 28px; color: var(--dim); font: 500 12px var(--mono); text-align: center; }
.foot a { color: var(--mute); }

@media (max-width: 1700px) { .g7 .kpi .d span:not(:only-child) { display: none; } }
@media (max-width: 1100px) { .g7 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g7 .kpi.big { grid-column: span 2; } }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .g2, .g3, .g4, .g21 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .wrap { padding: 10px 14px 60px; } .top-in { padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
  .brand small { display: none; } .stand { display: none; }
  .seg { order: 5; width: 100%; } .seg button { flex: 1; padding: 0 6px; }
  .g7 { grid-template-columns: repeat(2, minmax(0, 1fr)); --gap: 10px; } .grid { gap: 10px; margin-top: 10px; }
  .kpi .v { font-size: 28px; } .kpi.big .v { font-size: 32px; } .card { padding: 15px 15px; border-radius: 18px; }
  .fun .r { grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 8px; } .fun .n { font-size: 12px; }
  .heat { gap: 2px; grid-template-columns: 26px repeat(24, minmax(0, 1fr)); } .heat .c { height: auto; aspect-ratio: 1; border-radius: 3px; }
  .kpi .d span { display: none; }
  .card .hd small { display: none; } .heat .h:nth-child(odd) { visibility: hidden; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

        + (lim.length ? ' <span class="limb" title="' + esc(lim.map(function (l) { return new Date(l.t).toLocaleString('de-DE') + ' – ' + (l.w || ''); }).join('\n')) + '">Limit erreicht · ' + rel(lim[0].t) + (lim.length > 1 ? ' · ' + lim.length + '×' : '') + '</span>' : '')
        + '<small class="wo">' + (a.length ? a.length + (a.length === 1 ? ' Besuch' : ' Besuche') + ' · ' + dauer(zeit) + ' · ' + fr + (fr === 1 ? ' Frage' : ' Fragen') + (ger ? ' · ' + esc(ger) : '') : 'Noch kein Besuch seit Start der Messung (21.10.)') + '</small></span>'
        + '<small>' + (a.length ? 'aktiv ' + rel(o.last) : '–') + '</small>';
      if (!a.length) return '<div class="r">' + head + '</div>';
      return '<details class="uad"><summary class="r">' + head + '</summary><div class="uav">' + a.map(function (v) {
        var dt = new Date(v.s);
        return '<div><span>' + dt.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }) + ' · ' + dt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '</span><span>' + esc(v.d || '') + '</span><span>' + dauer(Math.max(60000, v.e - v.s)) + '</span><span>' + (v.q || 0) + (v.q === 1 ? ' Frage' : ' Fragen') + (v.l ? ' · <b class="liml">Limit</b>' : '') + '</span></div>';
      }).join('') + '</div></details>';
    }).join('') + '</div>' : '<div class="empty">Noch keine Konten.</div>';

    var nutz = '<div class="sub">Erstellt</div>' + bars(d.basis.erstellt) + '<div class="sub">Meistgenutzte Bereiche</div>' + bars(d.basis.bereiche, 0, function (x) { return BEREICH[x] || x; })
      + '<div class="sub">Max</div>' + bars([['Fragen im Chat & unten rechts', k.fragen || 0], ['Gespräche (Sprechen)', k.sprechen || 0], ['Skripte hochgeladen', k.upload || 0], ['Beispiel ausprobiert', k.beispiel || 0]].filter(function (x) { return x[1]; }));

    var H = d.heat || [], hmax = 1; H.forEach(function (r) { r.forEach(function (v) { if (v > hmax) hmax = v; }); });
    var WT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], heat = '<div class="heat"><span></span>';
    for (var hh = 0; hh < 24; hh++) heat += '<span class="h">' + hh + '</span>';
    H.forEach(function (r, i) { heat += '<span class="d">' + WT[i] + '</span>'; r.forEach(function (v, h2) { heat += '<span class="c"' + (v ? ' data-v' : '') + ' title="' + WT[i] + ' ' + h2 + '–' + (h2 + 1) + ' Uhr: ' + v + ' Besuche" style="' + (v ? 'background:rgba(255,255,255,' + (0.12 + 0.88 * v / hmax).toFixed(2) + ')' : '') + '"></span>'; }); });
    heat += '</div>';

    var ger = d.basis.geraet || [], gsum = ger.reduce(function (s2, y) { return s2 + y[1]; }, 0) || 1, SH = ['#fafafa', '#8e8e96', '#4a4a52', '#2a2a2e'];
    var geraete = ger.length ? '<div class="ring">' + ring(ger) + '<div class="bars" style="flex:1">' + ger.slice(0, 4).map(function (x, i) { return '<div class="r"><span><em class="sw" style="background:' + SH[i] + '"></em>' + esc(x[0]) + '</span><b class="num">' + Math.round(100 * x[1] / gsum) + ' %</b></div>'; }).join('') + '</div></div>' : '<div class="empty">Noch nichts.</div>';

    var reisen = d.reisen || [];
    var wege = reisen.length ? reisen.slice(0, showAllWege ? 40 : 6).map(function (r) {
      var steps = r.schritte.filter(function (s, i, arr) { return s.e !== 'Gescrollt' && !(i && arr[i - 1].e === s.e && arr[i - 1].d === s.d); });
      return '<div class="reise"><div class="k"><b>' + esc(r.ort || 'Unbekannter Ort') + '</b><small>' + esc([r.geraet, uhr(r.ab) + ' Uhr', dauer(r.bis - r.ab)].filter(Boolean).join(' · ')) + '</small>' + (r.wieder ? '<span class="badge w">kommt wieder</span>' : '<span class="badge">neu</span>') + (r.domain && r.domain !== 'bwlmax.de' ? '<span class="badge">' + esc(r.domain) + '</span>' : '') + '<span class="sp"></span><small>' + rel(r.bis) + '</small></div><div class="steps">'
        + steps.slice(0, 18).map(function (s, i) { return (i ? '<span class="arrow">→</span>' : '') + '<span class="step' + (HOT[s.e] ? ' hot' : '') + '" title="' + esc(uhr(s.t) + ' · ' + evText(s.e, s.d)) + '">' + ico((EV[s.e] || ['spark'])[0]) + esc(stepLabel(s.e, s.d)) + '</span>'; }).join('') + (steps.length > 18 ? '<span class="arrow">+' + (steps.length - 18) + '</span>' : '') + '</div></div>';
    }).join('') + (reisen.length > 6 ? '<button class="more" id="more">' + (showAllWege ? 'Weniger zeigen' : 'Alle ' + reisen.length + ' Besuche zeigen') + '</button>' : '') : '<div class="empty">Besucher-Wege erscheinen, sobald jemand Cookies erlaubt und sich umschaut.</div>';

    var sc = d.basis.scroll || {}, mitK = d.mitKennung || 0;
    var verhalten = bars([['50 % gescrollt', sc['50'] || 0], ['Bis ganz unten', sc['100'] || 0], ['Länger als 30 Sekunden', (d.basis.ereignisse || []).filter(function (x) { return x[0] === 'Länger als 30 Sekunden'; }).map(function (x) { return x[1]; })[0] || 0], ['Kommen wieder', d.wieder || 0]], Math.max(1, mitK));

    // Beim stillen Aktualisieren: Scroll-Position, offene Details und Feed-Position behalten – nichts springt
    var keep = [], n0 = app; while (n0) { if (n0.scrollTop) keep.push([n0, n0.scrollTop]); n0 = n0.parentNode || n0.host; }
    var wy = window.scrollY, feedTop = ($id('feed') || {}).scrollTop || 0;
    var openD = [].map.call(app.querySelectorAll('details.uad'), function (x) { return x.open; });
    app.classList.toggle('calm', !firstDraw);
    app.style.minHeight = firstDraw ? '' : app.offsetHeight + 'px';
    app.innerHTML =
      '<section class="grid g7">' + kpis + '</section>' +
      '<section class="grid g21"><div class="card"><div class="hd"><h2>Vom Besuch zum Konto</h2><span class="tm"><button data-tm="ads"' + (adsM ? ' class="on"' : '') + '>Nur Google Ads</button><button data-tm="alle"' + (adsM ? '' : ' class="on"') + '>Alle</button></span><small>Wo sie abspringen · ' + (tx.ab ? 'seit ' + new Date(tx.ab).toLocaleString('de-DE', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }) + ' Uhr' : esc(d.zeitraum.name)) + '</small></div><div class="fun">' + trich + '</div>' + fnote + '</div>' +
      '<div class="card"><div class="hd"><h2>Gerade passiert</h2><small>live</small></div><div class="feed" id="feed">' + feed + '</div></div></section>' +
      '<section class="grid"><div class="card"><div class="hd"><h2>Verlauf</h2><div class="leg"><span><i></i>Seitenaufrufe</span><span><i class="l2"></i>Besucher</span><span><i class="l3"></i>Aktiv</span></div></div><div class="chart" id="chart"></div></div></section>' +
      '<section class="grid g2"><div class="card"><div class="hd"><h2>Neue Konten</h2><small>' + esc(d.zeitraum.name) + '</small></div>' + konten + '</div>' +
      '<div class="card"><div class="hd"><h2>Nutzer-Aktivität</h2><small>' + (limN ? '<span class="limb">' + limN + ' im Limit (7 Tage)</span> · ' : '') + 'Besuche je Konto · ohne Inhalte</small></div>' + aktiv + '</div></section>' +
      '<section class="grid g4"><div class="card"><div class="hd"><h2>Was genutzt wird</h2><small>Funktionen</small></div>' + nutz + '</div>' +
      '<div class="card"><div class="hd"><h2>Woher</h2><small>Seitenaufrufe</small></div>' + bars(d.basis.herkunft) + '</div>' +
      '<div class="card"><div class="hd"><h2>Geräte</h2><small>Anteil</small></div>' + geraete + '</div>' +
      '<div class="card"><div class="hd"><h2>Verhalten</h2><small>von ' + fmt(mitK) + ' mit Cookies</small></div>' + verhalten + '<div class="sub">Städte</div>' + bars(d.basis.staedte) + '</div></section>' +
      '<section class="grid"><div class="card"><div class="hd"><h2>Wann sie kommen</h2><small>Seitenaufrufe je Wochentag & Stunde</small></div>' + heat + '</div></section>' +
      '<section class="grid"><div class="card"><div class="hd"><h2>Besucher-Wege</h2><small>Was jemand nacheinander gemacht hat</small></div><div id="wege">' + wege + '</div></div></section>' +
      '<div class="foot">Gezählt wird ohne Inhalte. Besucher: gleiches Gerät + gleicher Einstieg innerhalb von 30 Min. zählt einmal (Neuladen zählt nicht doppelt). Google-Ads-Klicks genauso – Google selbst meldet mit ein paar Stunden Verzögerung. Wege, Orte und Wiederkehrer nur bei Besuchern, die Cookies erlaubt haben (' + String(k.quote || 0).replace('.', ',') + ' %). · <span id="stand2"></span></div>';

    verlauf($id('chart'), achse, keys, bes, besR, akt);
    [].forEach.call(app.querySelectorAll('details.uad'), function (x, i) { if (openD[i]) x.open = true; });
    var fe = $id('feed'); if (fe && feedTop) fe.scrollTop = feedTop;
    if (!firstDraw) { keep.forEach(function (x) { x[0].scrollTop = x[1]; }); if (window.scrollY !== wy) window.scrollTo(0, wy); }
    app.style.minHeight = '';
    [].forEach.call(app.querySelectorAll('[data-tm]'), function (b) { b.onclick = function () { trMode = b.dataset.tm; try { localStorage.setItem('zl.trmode', trMode); } catch (e) {} draw(); }; });
    var mb = $id('more'); if (mb) mb.onclick = function () { showAllWege = !showAllWege; draw(); };
    firstDraw = false;
    tick();
  }

  function tick() {
    if (!data) return;
    var n = data.live ? data.live.besucher : 0;
    liveEl.classList.toggle('zero', !n); liveEl.querySelector('span').textContent = n ? (n === 1 ? '1 gerade da' : n + ' gerade da') : 'niemand gerade da';
    var s = data.stand ? 'Daten ' + rel(data.stand).replace('gerade eben', 'aktuell') : '';
    standEl.textContent = s; var s2 = $id('stand2'); if (s2) s2.textContent = s + (data.email ? ' · angemeldet als ' + data.email : '');
  }

  // ---------- Zustände ----------
  function gate(title, text, actions) {
    app.innerHTML = '<div class="gate"><div class="box"><img src="/tutor/img/max-fav-192.png?v=9" alt=""><h1>' + esc(title) + '</h1><p>' + text + '</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px">' + (actions || '') + '</div></div></div>';
  }
  function skeleton() {
    app.innerHTML = '<section class="grid g7">' + Array(7).join('<div class="skel" style="height:132px"></div>') + '<div class="skel" style="height:132px"></div></section><section class="grid"><div class="skel" style="height:320px"></div></section><section class="grid g2"><div class="skel" style="height:300px"></div><div class="skel" style="height:300px"></div></section>';
  }
  function session() { try { var v = localStorage.getItem('tutor.session'); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

  var busy = false;
  function load(quiet) {
    if (busy) return; busy = true;
    var ses = session();
    if (!ses) { busy = false; return gate('Kurz anmelden', 'Melde dich auf bwlmax.de mit deinem Konto an – danach siehst du hier alles, ohne extra Passwort.', '<a class="btn" href="/#/anmelden" onclick="try{sessionStorage.setItem(\'tutor.after\',\'/zahlen\')}catch(e){}">Bei BWL Max anmelden</a>'); }
    if (!quiet && !data) skeleton();
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ session: ses, zeit: Z }), cache: 'no-store' })
      .then(function (r) { return r.json().catch(function () { return { ok: false, status: r.status }; }).then(function (j) { j.status = r.status; return j; }); })
      .then(function (j) {
        busy = false;
        if (j.status === 401) return gate('Kurz anmelden', 'Melde dich bei BWL Max mit deinem Konto an (' + esc('bendeschler0@gmail.com') + ') – danach landest du automatisch wieder hier.', '<a class="btn" href="/#/anmelden" onclick="try{sessionStorage.setItem(\'tutor.after\',\'/zahlen\')}catch(e){}">Bei BWL Max anmelden</a>');
        if (j.status === 403) return gate('Kein Zugriff', 'Das Konto ' + esc(j.email || '') + ' darf diese Zahlen nicht sehen.', '<a class="btn ghost" href="/">Zu BWL Max</a>');
        if (j.status === 404) return gate('Fast fertig', 'Die Datenleitung vom Server wird gerade eingerichtet. Sobald sie steht, erscheinen hier deine Zahlen.', '<button class="btn ghost" onclick="location.reload()">Nochmal versuchen</button>');
        if (!j.ok || !j.basis) { if (data) return; return gate('Server nicht erreichbar', 'Gerade kommen keine Daten durch. Ich versuch es gleich wieder automatisch.', '<button class="btn ghost" onclick="location.reload()">Jetzt nochmal</button>'); }
        data = j; lastOk = Date.now(); draw();
      })
      .catch(function () { busy = false; if (!data) gate('Noch keine Verbindung', 'Die Datenleitung vom Server steht noch nicht oder ist gerade nicht erreichbar. Ich versuch es automatisch weiter.', '<button class="btn ghost" onclick="location.reload()">Jetzt nochmal</button>'); });
  }

  function setZ(z) {
    Z = z; try { localStorage.setItem('zahlen.z', z); } catch (e) {}
    [].forEach.call(segEl.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.dataset.z === z); b.setAttribute('aria-selected', b.dataset.z === z ? 'true' : 'false'); });
  }
  segEl.addEventListener('click', function (e) { var b = e.target.closest('button[data-z]'); if (!b || b.dataset.z === Z) return; setZ(b.dataset.z); firstDraw = true; data = null; load(); });
  setZ(Z);
  var onScroll = function () { var t = $id('top'); if (t) t.classList.toggle('scr', scrollY > 6); };
  addEventListener('scroll', onScroll, { passive: true });
  var rz = 0, onResize; addEventListener('resize', onResize = function () { clearTimeout(rz); rz = setTimeout(function () { if (data) { var c = $id('chart'); if (c) verlauf(c, data.zeitraum.achse, data.basis.achse || [], data.basis.reihe.besuche || [], data.besucherReihe || [], data.basis.reihe.aktiv || []); } }, 150); });
  load();
  timer = setInterval(function () { if (!document.hidden) load(true); }, 20000);
  var tickT = setInterval(tick, 10000);
  var onVis = function () { if (!document.hidden && Date.now() - lastOk > 15000) load(true); };
  document.addEventListener('visibilitychange', onVis);
  // In der App: beim Verlassen alles sauber stoppen
  window.__zlStop = function () { clearInterval(timer); clearInterval(tickT); removeEventListener('scroll', onScroll); removeEventListener('resize', onResize); document.removeEventListener('visibilitychange', onVis); window.__zlStop = null; };
})();
</script>
</body>
