    h += '<h2>Was die Leute wirklich gesucht haben (' + st.length + ')</h2><div class="c"><div class="tw"><table><tr><th class="l">Suchbegriff</th><th class="l">ausgelöst durch Keyword</th><th class="l">Status</th><th>Impr.</th><th>Klicks</th><th>CTR</th><th>Kosten</th></tr>' + (st.length ? st.map(function (x) { var p = x.key.split('\u0001'); return '<tr><td><b>' + esc(p[0]) + '</b></td><td class="l">' + esc(p[1] || '–') + '</td><td class="l">' + esc(STS[p[2]] || '') + '</td><td class="n">' + fmt(x.i) + '</td><td class="n">' + fmt(x.k) + '</td><td class="n">' + pc(x.k, x.i) + '</td><td class="n">' + eur(x.c) + '</td></tr>'; }).join('') : '<tr><td colspan="7">Noch keine Suchbegriffe im Zeitraum (Google zeigt sie mit etwas Verzögerung).</td></tr>') + '</table></div></div>';
    /* Anzeige */
    var STR = { EXCELLENT: 'Sehr gut', GOOD: 'Gut', AVERAGE: 'Durchschnittlich', POOR: 'Schlecht', PENDING: 'Wird berechnet' };
    var ad = grp((g.ads || []).filter(function (r) { return inR(r.d, R); }), function (r) { return r.id + '\u0001' + (r.str || '') + '\u0001' + (r.ap || ''); });
    h += '<h2>Anzeige &amp; Ausschlüsse</h2><div class="g k2"><div class="c"><h3>Anzeige</h3><div class="tw"><table style="min-width:0"><tr><th class="l">Anzeige</th><th class="l">Effektivität</th><th>Impr.</th><th>Klicks</th><th>CTR</th><th>Kosten</th></tr>' + (ad.length ? ad.map(function (x) { var p = x.key.split('\u0001'); return '<tr><td>Suchanzeige ' + esc(p[0].slice(-4)) + '</td><td class="l">' + esc(STR[p[1]] || p[1] || '–') + '</td><td class="n">' + fmt(x.i) + '</td><td class="n">' + fmt(x.k) + '</td><td class="n">' + pc(x.k, x.i) + '</td><td class="n">' + eur(x.c) + '</td></tr>'; }).join('') : '<tr><td colspan="6">–</td></tr>') + '</table></div></div>'
      + '<div class="c"><h3>Ausschluss-Keywords (' + (g.neg || []).length + ')</h3><div class="chips">' + (g.neg || []).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div></div></div>';
    if (g.err && g.err.length) h += '<p class="note">Hinweis vom Skript: ' + esc(g.err.join(' | ')) + '</p>';
    $('#main').innerHTML = h; bind();
  }
  function bind() {
    $$('.vh').forEach(function (x) { x.onclick = function () { x.parentNode.classList.toggle('on'); }; });
    $$('#kt button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === KT); b.onclick = function () { KT = b.dataset.k; ls.set('miads.kt', KT); draw(); }; });
  }
  function barChart(T) {
    if (!T.length) return '<p class="note">Noch keine Tage.</p>';
    var W = 1000, H = 220, P = 30, n = T.length, bw = (W - 2 * P) / n, mc = Math.max.apply(null, [1].concat(T.map(function (r) { return r.c; }))), mk = Math.max.apply(null, [1].concat(T.map(function (r) { return r.k; })));
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img"><line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="#e3e8f2"/>';
    T.forEach(function (r, i) {
      var x = P + i * bw, hc = (H - 2 * P) * r.c / mc, hk = (H - 2 * P) * r.k / mk, w = Math.min(36, bw * 0.35);
      s += '<rect x="' + (x + bw / 2 - w - 2) + '" y="' + (H - P - hc) + '" width="' + w + '" height="' + hc + '" rx="5" fill="#2563eb"><title>' + dL(r.d) + ': ' + eur(r.c) + '</title></rect>';
      s += '<rect x="' + (x + bw / 2 + 2) + '" y="' + (H - P - hk) + '" width="' + w + '" height="' + hk + '" rx="5" fill="#06b6d4"><title>' + dL(r.d) + ': ' + r.k + ' Klicks</title></rect>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="12" fill="#64748b">' + dL(r.d) + '</text>';
      s += '<text x="' + (x + bw / 2 - w / 2 - 2) + '" y="' + (H - P - hc - 6) + '" text-anchor="middle" font-size="11" fill="#1d4ed8">' + (r.c ? r.c.toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' €' : '') + '</text>';
      s += '<text x="' + (x + bw / 2 + w / 2 + 2) + '" y="' + (H - P - hk - 6) + '" text-anchor="middle" font-size="11" fill="#0891b2">' + (r.k || '') + '</text>';
    });
    return s + '</svg>';
  }
  load();
})();
</script>
