    /* Tag für Tag */
    var cols = [['b', 'Besuche'], ['z10', '> 10 s'], ['h', 'halbe Seite'], ['t', 'Testlektion'], ['p', 'Preis gesehen'], ['z', 'Zur Zahlung'], ['k', 'Gekauft']];
    var tt = N.tage.length ? '<div class="tw h"><table><tr><th>Tag</th>' + cols.map(function (c) { return '<th class="n">' + c[1] + '</th>'; }).join('') + '</tr>' + N.tage.map(function (r) { var d0 = new Date(r[0] + 'T12:00:00'); return '<tr><td><b>' + d0.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }) + '</b></td>' + cols.map(function (c) { var v = r[1][c[0]] || 0; return '<td class="n' + (c[0] === 'k' && v ? ' okc' : '') + '">' + (v ? fmt(v) + (c[0] !== 'b' && r[1].b ? ' <span class="s">' + pc(v, r[1].b) + '</span>' : '') : '<span class="s">–</span>') + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>' : '<div class="empty">Noch keine Daten.</div>';
    h += sec('Tag für Tag') + '<div class="grid">' + card('Jeder Tag', KN[Q], tt) + '</div>';
    return h;
  }

  /* ---------- LANDINGPAGE ---------- */
  function segTable(list, label) {
    if (!list || !list.length) return '<div class="empty">Noch keine Daten.</div>';
    return '<div class="tw"><table><tr><th>' + label + '</th><th class="n">Besuche</th><th class="n">&gt; 10 s</th><th class="n">Testlektion</th><th class="n">Preis</th><th class="n">Zahlung</th><th class="n">Median</th></tr>' + list.map(function (x) { var o = x[1]; return '<tr><td><b>' + esc(x[0]) + '</b></td><td class="n">' + fmt(o.b) + '</td><td class="n">' + pc(o.z10, o.b) + '</td><td class="n">' + pc(o.t, o.b) + '</td><td class="n">' + pc(o.p, o.b) + '</td><td class="n">' + fmt(o.z) + '</td><td class="n">' + zeit(o.med) + '</td></tr>'; }).join('') + '</table></div>';
  }
  function vLand(d) {
    var N = d.x.nach[Q], b = N.besuche, nr = N.mitNr || 0;
    var h = '<div class="grid g3">' + card('Wie lange sie bleiben', nr ? fmt(nr) + ' Aufrufe gemessen · Median ' + zeit(N.med) : 'beim Verlassen', bars(N.verweil, N.verweil.reduce(function (a, x) { return a + x[1]; }, 0), 'n')) +
      card('Wie weit sie scrollen', nr ? 'tiefster Punkt je Aufruf' : 'ab heute je Aufruf', bars(N.scroll, nr, 'o')) +
      card('Welche Bereiche sie sehen', 'in Seitenreihenfolge, Anteil der Besuche', bars(N.bereiche, b, 'g')) + '</div>';
    var F = N.fragen, ft = F.length ? '<table><tr><th>Szene</th><th class="n">richtig</th><th class="n">falsch</th><th class="n">Quote</th></tr>' + F.map(function (x) { return '<tr><td>' + esc(x[0]) + '</td><td class="n okc">' + fmt(x[1]) + '</td><td class="n badc">' + fmt(x[2]) + '</td><td class="n">' + pc(x[1], x[1] + x[2]) + '</td></tr>'; }).join('') + '</table>' : '<div class="empty">Noch niemand hat die Testlektion gespielt.</div>';
    var T = N.tarife, tz = T.fs + T.fk + T.fp;
    h += '<div class="grid g3">' + card('Testlektion', 'Antworten pro Szene', ft + (N.ergebnis.length ? sub('Ergebnis am Ende') + bars(N.ergebnis, 0, 'g') : '')) +
      card('Kauf-Bereich', 'was am Ende passiert', '<div class="tri"><div><small>Zur Zahlung</small><b>' + fmt(N.zahl) + '</b></div><div><small>Kästchen vergessen</small><b class="warnc">' + fmt(N.fehlt) + '</b></div><div><small>Stripe abgebrochen</small><b class="badc">' + fmt(N.abbruch) + '</b></div></div>' + sub('Gewählter Tarif') + bars([['Paket', T.fp], ['Internet-Führerschein', T.fs], ['KI-Führerschein', T.fk]], tz, 'o')) +
      card('Fragen im FAQ', 'aufgeklappt', bars(N.faq, 0, 'n', 10) + '<p class="note">„i“ bei den Stimmen geöffnet: ' + fmt(N.info) + '×</p>') + '</div>';
    h += '<div class="grid g2">' + card('Geräte', '', segTable(N.geraete, 'Gerät')) + card('Landingpages', '', segTable(N.seiten, 'Seite')) + '</div>';
    var H = N.stunden, mh = Math.max.apply(null, H.map(function (x) { return x[0]; })) || 1;
    var hrs = '<div class="hours">' + H.map(function (x, i) { return '<div class="' + (x[1] ? 'z' : '') + '" style="height:' + Math.max(2, x[0] / mh * 100) + '%" title="' + i + ' Uhr: ' + x[0] + ' Besuche, ' + x[1] + ' zur Zahlung"></div>'; }).join('') + '</div><div class="hl24">' + H.map(function (x, i) { return '<span>' + (i % 3 ? '' : i) + '</span>'; }).join('') + '</div><p class="note">Orange: Stunden mit Klick auf „Zur Zahlung“. Deutsche Zeit.</p>';
    h += '<div class="grid g21">' + card('Uhrzeit', 'Besuche je Stunde', hrs) + card('Wochentag', '', bars(N.wochentage, b, 'n')) + '</div>';
    return h;
  }

  /* ---------- BESUCHE ---------- */
  function vBesuche(d) {
    var L = d.x.nach[Q].besuche2;
    if (!L.length) return '<div class="grid">' + card('Einzelne Besuche', '', '<div class="empty">Ab jetzt erscheint hier jeder Besuch der Führerschein-Seiten einzeln: wie lange, wie weit gescrollt, Testlektion, Preis, Kasse. Anonym, nur dieser eine Seitenaufruf.</div>') + '</div>';
    var rows = L.map(function (v) {
      var c = []; if (v.test) c.push('<span class="chip ok">Testlektion ' + esc(v.test) + '</span>'); if (v.ber.indexOf('Preis') >= 0) c.push('<span class="chip">Preis gesehen</span>'); if (v.faq) c.push('<span class="chip">FAQ ' + v.faq + '×</span>'); if (v.bean) c.push('<span class="chip">Beantragen</span>'); if (v.fehlt) c.push('<span class="chip bad">Kästchen vergessen</span>'); if (v.z) c.push('<span class="chip or">Zur Zahlung: ' + esc(v.z) + '</span>');
      return '<div class="vi"><time>' + hm(v.t) + '</time><div><div class="vt">' + chipK(v.k) + '<b>' + esc(v.s) + '</b><span class="s">' + esc(v.g || '') + '</span></div><div class="vm"><span><b>' + (v.sec ? zeit(v.sec) : esc(v.secB || '–')) + '</b> zu sehen</span><span><b>' + (v.sc ? v.sc + ' %' : '–') + '</b> gescrollt</span><i style="--w:' + (v.sc || 0) + '%"></i></div><div>' + (c.join('') || '<span class="s">nur angeschaut</span>') + '</div></div></div>';
    }).join('');
    return '<div class="grid">' + card('Einzelne Besuche', fmt(L.length) + ' neueste · ' + esc(KN[Q]), '<div class="feed">' + rows + '</div><p class="note">Ohne Cookie und ohne Kennung: Jeder Aufruf bekommt nur eine Zufallsnummer im Arbeitsspeicher. Wer zweimal kommt, steht zweimal da.</p>') + '</div>';
  }

  /* ---------- KUNDEN ---------- */
  function vKunden(d) {
    var K = d.x.kunden || [], E = K.filter(function (x) { return !x.ben; }), B = K.filter(function (x) { return x.ben; });
    var tab = function (L) { return L.length ? '<div class="tw"><table style="min-width:900px"><tr><th>Konto</th><th>Führerschein</th><th class="n">Klasse</th><th>Antrag</th><th class="n">Internet</th><th class="n">KI</th><th>Bewertung</th><th>Zuletzt aktiv</th></tr>' + L.map(function (x) { var pi = function (n, ok) { return ok ? '<span class="chip ok">bestanden</span>' : n ? fmt(n) + ' <span class="s">/ 24</span>' : '<span class="s">–</span>'; }; return '<tr><td><b>' + esc(x.kind || 'ohne Namen') + '</b><br><span class="s">' + esc(x.email) + '</span></td><td>' + esc(x.plan) + '<br><span class="s">' + dat(x.seit) + '</span></td><td class="n">' + esc(x.klasse || '–') + '</td><td>' + (x.antrag ? '<span class="chip ok">ausgefüllt</span>' : '<span class="chip bad">fehlt</span>') + '</td><td class="n">' + pi(x.inet, x.inetOk) + '</td><td class="n">' + pi(x.ki, x.kiOk) + '</td><td>' + (x.bewertet ? '<span class="chip ok">ja</span>' : '<span class="s">–</span>') + '</td><td>' + dat(x.aktiv) + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">Noch keine Führerschein-Kunden.</div>'; };
    var ant = E.filter(function (x) { return x.antrag; }).length, lern = E.filter(function (x) { return x.inet + x.ki > 0; }).length, best = E.filter(function (x) { return x.inetOk || x.kiOk; }).length;
    var h = '<div class="grid k6">' + k('Kunden', fmt(E.length), 'Konten mit Führerschein') + k('Antrag ausgefüllt', fmt(ant), pc(ant, E.length)) + k('Lernen schon', fmt(lern), pc(lern, E.length) + ' mit mind. 1 Lektion') + k('Bestanden', fmt(best), pc(best, E.length)) + k('Bewertet', fmt(E.filter(function (x) { return x.bewertet; }).length), '') + k('Aktiv letzte 7 Tage', fmt(E.filter(function (x) { return x.aktiv && Date.now() - Date.parse(x.aktiv) < 7 * 864e5; }).length), '') + '</div>';
    h += '<div class="grid">' + card('Führerschein-Kunden', 'pro Kurs 24 Lektionen, dann Prüfung', tab(E)) + '</div>';
    if (B.length) h += sec('Deine eigenen Konten') + '<div class="grid">' + card('Bens Konten', 'zählen nirgends mit', tab(B)) + '</div>';
    return h;
  }

  /* ---------- LIVE ---------- */
  function vLive(d) {
    var F = (d.x.feed || []).filter(function (x) { return Q === 'alle' || x.k === Q; });
    var fd = F.map(function (x) { return '<div class="fe"><time>' + hm(x.t) + '</time><div><b>' + esc(x.e) + '</b>' + (x.d ? ' · ' + esc(x.d) : '') + '<div class="m">' + chipK(x.k) + esc([x.g, x.s, x.a ? 'Aufruf …' + x.a : ''].filter(Boolean).join(' · ')) + '</div></div></div>'; }).join('');
    return '<div class="grid">' + card('Gerade passiert', 'neueste zuerst', '<div class="feed">' + (fd || '<div class="empty">Noch nichts passiert.</div>') + '</div>') + '</div>';
  }

  var TABS = [['geld', 'Geld'], ['trichter', 'Trichter'], ['land', 'Landingpage'], ['besuche', 'Besuche'], ['kunden', 'Kunden'], ['live', 'Live']];
  if (!TABS.some(function (x) { return x[0] === T; })) T = 'geld';
  function tabs() {
    var tb = $('#tabs'); tb.innerHTML = TABS.map(function (t) { return '<button type="button" data-t="' + t[0] + '" class="' + (t[0] === T ? 'on' : '') + '">' + t[1] + '</button>'; }).join('');
    $$('#tabs button').forEach(function (b) { b.onclick = function () { T = b.dataset.t; ls.set('gsmz.t3', T); draw(D); window.scrollTo(0, 0); }; });
    var on = tb.querySelector('.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function draw(d) {
    D = d; tabs();
    var V = { geld: vGeld, trichter: vTrichter, land: vLand, besuche: vBesuche, kunden: vKunden, live: vLive }[T];
    var np = d.nullpunkt ? new Date(d.nullpunkt).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }) : '';
    var sy = window.scrollY;
    $('#main').innerHTML = V(d) + '<p class="lede">' + (T === 'geld' ? 'Geld-Seite zeigt immer alle Kanäle. ' : esc(KN[Q]) + '. ') + 'Gezählt ab ' + np + ' Uhr. Deine eigenen Geräte und Konten zählen nie mit. Ohne Cookie wird anonym gezählt; Anzeigen-Besuche sind trotzdem als solche erkennbar.</p>';
    if (T === 'geld') bindKosten();
    window.scrollTo(0, sy);
    $('#stand').textContent = 'Stand ' + new Date(d.stand).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' · ' + fmt(d.x.gesamt) + ' Ereignisse';
  }
  load();
  setInterval(function () { if (!document.hidden && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('.ko'))) load(); }, 90000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
