<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GSM Zahlen">
<title>Zahlen · Grundschulmax</title>
<link rel="icon" type="image/png" href="/grundschulmax/max-96.png">
<link rel="apple-touch-icon" href="/grundschulmax/max-96.png">
<style>
@font-face{font-family:G;src:url(/grundschulmax/geist.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#f3eee4;--card:#fff;--line:#ebe4d7;--line2:#ddd3c2;--ink:#15151a;--ink2:#3d3a35;--mute:#7a746a;--dim:#cfc6b6;--acc:#1a5fc4;--vio:#6c4fe0;--ok:#16a05c;--bad:#e5484d;--warn:#e08a12;--r:20px;--gap:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 G,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit}
.num,td.n,.v{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1380px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:12px;background:#fff;object-fit:cover}
.brand b{font-size:17px;letter-spacing:-.02em;display:block}
.brand small{color:var(--mute);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sp{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line2);background:var(--card)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--mute);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.ib{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ib i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.ib.on i{background:var(--ok)}
.stand{color:var(--mute);font-size:12px;white-space:nowrap}
.wrap{max-width:1380px;margin:0 auto;padding:16px 20px 80px}
.grid{display:grid;gap:var(--gap);margin-top:var(--gap)}
.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.k8{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec{margin:28px 2px 0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.sub2{margin:14px 0 8px;font-size:13px;font-weight:700}
.tw{overflow:auto;max-height:640px}
.tw table{min-width:860px}
.tw th{position:sticky;top:0;background:var(--card);z-index:1}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eef6ee;color:var(--ok)}
.pill.m{background:#f2efe8;color:var(--mute)}
.six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.six div{background:#f7f3ec;border-radius:14px;padding:10px 12px}
.six b{display:block;font-size:22px;letter-spacing:-.03em}
.six small{color:var(--mute);font-weight:600;font-size:12px}
.tabs{max-width:1380px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 15px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:13.5px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs .cn{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11.5px;display:inline-grid;place-items:center}
.tabs button.on .cn{background:rgba(255,255,255,.25)}
.bst .dist{min-width:70px}
@media (max-width:560px){.bst th,.bst td{padding:7px 4px;font-size:12.5px}.bst td .s{display:none}}
.br.w{grid-template-columns:minmax(0,1fr) 96px}.br.w .c{white-space:nowrap}
.lede{color:var(--mute);font-size:12.5px;margin:12px 2px 0;line-height:1.5}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#f2ede4;min-width:140px}
.dist i{display:block;height:100%}
.dleg{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);font-weight:600;margin-top:10px}
.dleg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:44px minmax(160px,1.4fr) repeat(5,minmax(70px,1fr)) 24px;gap:12px;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(180deg,#5aa2f7,#1a5fc4)}
.acc.ben .av{background:linear-gradient(180deg,#b9b2a6,#857d70)}
.acc .who{min-width:0}.acc .who b{display:block;font-size:15px}.acc .who small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .st small{display:block;color:var(--mute);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.acc .st b{font-size:16px}
.acc .chev{color:var(--mute);font-size:22px;transition:transform .2s}.acc[open] .chev{transform:rotate(90deg)}
.accb{padding:0 18px 18px;border-top:1px solid var(--line);background:#fbf9f5}
.accb .card{background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span{color:var(--mute)}.kv b{font-weight:650}
@media (max-width:900px){.acc>summary{grid-template-columns:40px minmax(0,1fr) auto 18px;padding:12px 14px}.acc .st{display:none}.acc .st.k{display:block;text-align:right}.accb{padding:0 12px 12px}.tabs{padding:0 16px 10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;overflow:hidden}
.card h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.hd small{color:var(--mute);font-size:11.5px;font-weight:600}
.kpi .l{color:var(--mute);font-size:12.5px;font-weight:600}
.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.kpi .d{font-size:12px;color:var(--mute);font-weight:600;min-height:18px}
.fun{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 64px 62px 64px;gap:10px;align-items:center;font-size:13.5px}
.fr .lb{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .bar{height:26px;border-radius:9px;background:#f4efe6;position:relative;overflow:hidden}
.fr .bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--vio));min-width:3px}
.fr .bar span.o{color:var(--ink);text-shadow:none}
.fr .bar span{position:absolute;left:10px;top:50%;translate:0 -50%;font-weight:700;font-size:12.5px;color:#fff;mix-blend-mode:normal;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.fr .pc{text-align:right;font-weight:700}
.fr .dr{text-align:right;font-weight:700;color:var(--bad)}
.fr .dr.z{color:var(--dim)}
.fr .u{text-align:right;color:var(--mute);font-size:12px}
.fh{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fh .bar{background:none;height:auto}
.note{color:var(--mute);font-size:12.5px;margin-top:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:0 6px 8px;white-space:nowrap}
th.n,td.n{text-align:right}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
td.n{font-weight:650;white-space:nowrap}
td .s{color:var(--mute);font-weight:500;font-size:12px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.bars{display:grid;gap:6px}
.br{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13px}
.br .t{position:relative;padding:5px 9px;border-radius:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.br .t i{position:absolute;inset:0 auto 0 0;background:#ece5ff;border-radius:8px;z-index:0}
.br .t span{position:relative;z-index:1}
.br .c{text-align:right;font-weight:700}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tri div{background:#f7f3ec;border-radius:14px;padding:10px 12px}
.tri b{display:block;font-size:24px;letter-spacing:-.03em}
.tri small{color:var(--mute);font-weight:600;font-size:12px}
.chart svg{width:100%;height:190px;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-weight:600;margin-top:8px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.feed{max-height:520px;overflow:auto}
.fe{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.fe:first-child{border-top:0}
.fe time{color:var(--mute);font-weight:600;font-size:12px}
.fe b{font-weight:650}
.fe .m{color:var(--mute);font-size:12px}
.gate{max-width:460px;margin:12vh auto 0;text-align:center}
.gate img{width:84px;height:84px;border-radius:24px;background:#fff}
.gate h1{font-size:24px;letter-spacing:-.02em;margin:14px 0 6px}
.gate p{color:var(--ink2);margin:0 0 18px}
.gate a{display:inline-flex;height:46px;align-items:center;padding:0 20px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;text-decoration:none}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,#ece6db,#f6f2ea,#ece6db);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.err{background:#fff1f0;border:1px solid #f6c6c3;color:#9b1c1c;border-radius:14px;padding:10px 14px;font-size:13.5px;margin-top:var(--gap)}
@media (max-width:1100px){.k8{grid-template-columns:repeat(2,minmax(0,1fr))}.k6{grid-template-columns:repeat(3,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}}
@media (max-width:720px){.top-in{padding:10px 16px}.wrap{padding:12px 16px 60px}.k6,.g2,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2>.wide,.g3>.wide{grid-column:1/-1}.kpi .v{font-size:26px}
 .fr{grid-template-columns:minmax(0,1fr) 54px 54px;row-gap:4px}.fr .bar{grid-column:1/-1;order:5}.fr .u{display:none}.fr.fh{display:none}
 .stand{order:9;width:100%}}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}.tri b{font-size:20px}.seg button{padding:0 9px}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><img src="/grundschulmax/max-96.png" alt=""><div><b>Zahlen</b><small>Grundschulmax · nur für Ben</small></div></div>
  <div class="sp"></div>
  <div class="seg" id="seg"><button data-z="alle">Gesamt</button><button data-z="30">30 Tage</button><button data-z="7">7 Tage</button><button data-z="heute">Heute</button></div>
  <button class="ib" id="intern" title="Besuche von diesem Gerät nicht mitzählen"><i></i><span>Gerät nicht zählen</span></button>
  <button class="ib" id="reload" aria-label="Neu laden">↻</button>
  <span class="stand" id="stand"></span>
</div><nav class="tabs" id="tabs"></nav></div>
<main class="wrap" id="main"><div class="grid k6">
<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
<script>
(function () {
  var API = 'https://mrbell.app.n8n.cloud/webhook/gsm-zahlen-764dba';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return (+n || 0).toLocaleString('de-DE'); };
  var pct = function (a, b) { return b ? Math.round(a / b * 1000) / 10 : 0; };
  var pc = function (a, b) { a = +a || 0; b = +b || 0; return b ? String(pct(a, b)).replace('.', ',') + ' %' : '–'; };
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var Z = ls.get('gsmz.z2') || 'alle', timer = 0, busy = false;
  // Interne Besuche ausschließen (Cookie wird von der Middleware geprüft)
  var isIntern = function () { return /(?:^|;\s*)gsm_intern=1/.test(document.cookie); };
  var setIntern = function (on) { document.cookie = 'gsm_intern=' + (on ? '1; Max-Age=315360000' : '; Max-Age=0') + '; Path=/; SameSite=Lax; Secure'; drawIntern(); };
  var drawIntern = function () { var b = $('#intern'); b.classList.toggle('on', isIntern()); b.querySelector('span').textContent = isIntern() ? 'Gerät wird nicht gezählt' : 'Gerät wird gezählt'; };
  $('#intern').onclick = function () { setIntern(!isIntern()); };
  drawIntern();
  [].forEach.call(document.querySelectorAll('#seg button'), function (b) { b.classList.toggle('on', b.dataset.z === Z); b.onclick = function () { Z = b.dataset.z; ls.set('gsmz.z2', Z); [].forEach.call(document.querySelectorAll('#seg button'), function (x) { x.classList.toggle('on', x === b); }); load(); }; });
  $('#reload').onclick = function () { load(); };

  function gate(title, text) {
    $('#main').innerHTML = '<div class="gate"><img src="/grundschulmax/max-96.png" alt=""><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p><a href="/">Zu Grundschulmax</a></div>';
    $('#stand').textContent = '';
  }
  function load() {
    var tok = ls.get('gsm-token');
    if (!tok) { gate('Bitte anmelden', 'Melde dich auf grundschulmax.de mit deinem Konto an und öffne dann diese Seite noch einmal.'); return; }
    if (busy) return; busy = true; $('#reload').textContent = '…';
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ token: tok, zeit: Z }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) { gate(d && d.grund === 'Dieses Konto hat keinen Zugriff.' ? 'Kein Zugriff' : 'Bitte neu anmelden', (d && d.grund) || 'Die Anmeldung ist abgelaufen.'); return; }
        if (!isIntern() && ls.get('gsmz.auto') !== '1') { setIntern(true); ls.set('gsmz.auto', '1'); }
        draw(d);
      })
      .catch(function () { var m = $('#main'); if (!m.querySelector('.err')) m.insertAdjacentHTML('afterbegin', '<div class="err">Die Zahlen konnten gerade nicht geladen werden. Ich versuche es gleich wieder.</div>'); })
      .then(function () { busy = false; $('#reload').textContent = '↻'; });
  }
  function card(title, sub, body, cls) { return '<section class="card ' + (cls || '') + '"><div class="hd"><h2>' + esc(title) + '</h2>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' + body + '</section>'; }
  function bars(list, max) {
    if (!list || !list.length) return '<div class="empty">Noch keine Daten.</div>';
    var m = Math.max.apply(null, list.map(function (x) { return x[1]; })) || 1;
    return '<div class="bars">' + list.slice(0, max || 12).map(function (x) { return '<div class="br"><div class="t"><i style="width:' + Math.max(2, x[1] / m * 100) + '%"></i><span>' + esc(x[0]) + '</span></div><div class="c">' + fmt(x[1]) + '</div></div>'; }).join('') + '</div>';
  }
  function sfa(list, label) {
    if (!list || !list.length) return '<div class="empty">Noch keine Daten.</div>';
    return '<table><tr><th>' + label + '</th><th class="n">Gestartet</th><th class="n">Fertig</th><th class="n">Abgebr.</th></tr>' + list.slice(0, 30).map(function (x) { var o = x[1]; return '<tr><td>' + esc(x[0]) + '</td><td class="n">' + fmt(o.s) + '</td><td class="n ok">' + fmt(o.f) + ' <span class="s">' + pc(o.f, o.s) + '</span></td><td class="n bad">' + fmt(o.a) + ' <span class="s">' + pc(o.a, o.s) + '</span></td></tr>'; }).join('') + '</table>';
  }
  function tri(o) { return '<div class="tri"><div><small>Gestartet</small><b>' + fmt(o.s) + '</b></div><div><small>Fertig</small><b class="ok">' + fmt(o.f) + '</b><small>' + pc(o.f, o.s) + '</small></div><div><small>Abgebrochen</small><b class="bad">' + fmt(o.a) + '</b><small>' + pc(o.a, o.s) + '</small></div></div>'; }
  function chart(tage) {
    if (!tage || !tage.length) return '<div class="empty">Noch keine Daten.</div>';
    var W = 760, H = 190, P = 26, n = tage.length, m = 1;
    tage.forEach(function (t) { m = Math.max(m, t[1].b, t[1].a, t[1].l); });
    var bw = (W - P * 2) / n, s = '';
    tage.forEach(function (t, i) {
      var x = P + i * bw, o = t[1], h = function (v) { return v / m * (H - 40); };
      s += '<rect x="' + (x + bw * .1) + '" y="' + (H - 22 - h(o.b)) + '" width="' + bw * .26 + '" height="' + h(o.b) + '" rx="2" fill="#1a5fc4"><title>' + t[0] + ': ' + o.b + ' Besuche</title></rect>';
      s += '<rect x="' + (x + bw * .38) + '" y="' + (H - 22 - h(o.a)) + '" width="' + bw * .26 + '" height="' + h(o.a) + '" rx="2" fill="#6c4fe0"><title>' + t[0] + ': ' + o.a + ' Ausprobieren</title></rect>';
      s += '<rect x="' + (x + bw * .66) + '" y="' + (H - 22 - h(o.l)) + '" width="' + bw * .26 + '" height="' + h(o.l) + '" rx="2" fill="#16a05c"><title>' + t[0] + ': ' + o.l + ' erste Lektionen</title></rect>';
      if (o.z) s += '<text x="' + (x + bw / 2) + '" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="#e08a12">' + o.z + ' Abo</text>';
      if (n <= 14 || i % Math.ceil(n / 10) === 0) s += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10.5" fill="#7a746a">' + t[0].slice(8) + '.' + t[0].slice(5, 7) + '.</text>';
    });
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + s + '</svg></div><div class="leg"><span style="--c:#1a5fc4">Besuche</span><span style="--c:#6c4fe0">Ausprobieren</span><span style="--c:#16a05c">Erste Lektion</span><span style="--c:#e08a12">Abos</span></div>';
  }
  function zeitHM(t) { var d = new Date(t), now = new Date(), hm = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }); return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', timeZone: 'Europe/Berlin' }) + '<br>' + hm; }
  var NM = { home: 'Abenteuer', path: 'Lernpfad', games: 'Spiele', hw: 'Hausaufgaben', test: 'Probetest', play: 'Spielen',

  function dauer(s) { s = Math.round(+s || 0); return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }
  load();
  clearInterval(timer); timer = setInterval(function () { if (!document.hidden) load(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
